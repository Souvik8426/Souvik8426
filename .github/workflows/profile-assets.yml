name: Build pixel profile assets

# Generates every dynamic image used by README.md and publishes them to the
# `output` branch. Each generator may fail on its own (they are third-party
# actions hitting the GitHub API); when one does, the file from the previous
# run is kept so the README never shows a broken image.

on:
  schedule:
    - cron: "17 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIXEL_TOKEN: ${{ secrets.PIXEL_PROFILE_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # pixel-profile reads star counts, which the default GITHUB_TOKEN may not
      # access. With a PIXEL_PROFILE_TOKEN secret (a classic PAT with no scopes
      # is enough for public data) the cards are rendered here; without it,
      # they are downloaded from the hosted pixel-profile API instead.
      - name: Pixel stats cards (pixel-profile action)
        id: pixel
        if: env.PIXEL_TOKEN != ''
        continue-on-error: true
        uses: LuciNyan/pixel-profile/action@main
        with:
          github_token: ${{ env.PIXEL_TOKEN }}
          outputs: |
            dist/pixel-stats-dark.png?username=${{ github.repository_owner }}&theme=rainbow&screen_effect=true&include_all_commits=true
            dist/pixel-stats-light.png?username=${{ github.repository_owner }}&theme=fuji&dithering=true&include_all_commits=true
          crt_outputs: |
            dist/pixel-stats-crt.png?username=${{ github.repository_owner }}&include_all_commits=true

      - name: Pixel stats cards (hosted pixel-profile API)
        id: pixel_hosted
        if: env.PIXEL_TOKEN == ''
        continue-on-error: true
        run: |
          mkdir -p dist
          base="https://pixel-profile.vercel.app/api/github-stats?username=${GITHUB_REPOSITORY_OWNER}&include_all_commits=true"
          rc=0
          fetch() {
            # keep the file only if it really is an image
            if curl -fsSL --retry 3 --retry-delay 10 --max-time 120 -o "$1.tmp" "$base&$2" \
               && { [ "$(head -c4 "$1.tmp" | od -An -tx1 | tr -d ' \n')" = "89504e47" ] || grep -q "<svg" "$1.tmp"; }; then
              mv "$1.tmp" "$1"; echo "fetched $1"
            else
              rm -f "$1.tmp"; echo "::warning::could not fetch $1"; rc=1
            fi
          }
          fetch dist/pixel-stats-dark.png  "theme=rainbow&screen_effect=true"
          fetch dist/pixel-stats-light.png "theme=fuji&dithering=true"
          fetch dist/pixel-stats-crt.png   "theme=crt"
          exit $rc

      - name: Arcade contribution graphs (Pac-Man, Galaga, Breakout, Tetris, Bomberman)
        id: arcade
        continue-on-error: true
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman,galaga,breakout,tetris,bomberman

      - name: Snake contribution graph
        id: snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Run the CLI directly: the gh-space-shooter action commits to the
      # checked-out branch even with no-commit set.
      - name: Space shooter GIF
        id: shooter
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pipx run --spec gh-space-shooter==2.0.5 gh-space-shooter "$GITHUB_REPOSITORY_OWNER" \
            --output dist/space-shooter.gif --strategy random --fps 30

      - name: Keep previous files for any generator that failed
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output 2>/dev/null; then
            git ls-tree --name-only FETCH_HEAD | while read -r f; do
              if [ ! -e "dist/$f" ]; then
                echo "keeping previous $f"
                git show "FETCH_HEAD:$f" > "dist/$f"
              fi
            done
          fi
          ls -la dist

      - name: Publish to the output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist  # snake writes as root
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000
          git add -A
          git commit -qm "Update profile assets"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4; do
            git push -f "$remote" output && exit 0
            echo "push attempt $attempt failed, retrying"; sleep $((attempt * 15))
          done
          exit 1

      - name: Report failed generators
        if: steps.pixel.outcome == 'failure' || steps.pixel_hosted.outcome == 'failure' || steps.arcade.outcome == 'failure' || steps.snake.outcome == 'failure' || steps.shooter.outcome == 'failure'
        run: |
          echo "pixel=${{ steps.pixel.outcome }} pixel_hosted=${{ steps.pixel_hosted.outcome }} arcade=${{ steps.arcade.outcome }} snake=${{ steps.snake.outcome }} shooter=${{ steps.shooter.outcome }}"
          exit 1
